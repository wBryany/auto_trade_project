[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "btc-futures-bot"
version = "0.1.0"
description = "A dry-run-first multi-exchange BTC perpetual futures trading system"
requires-python = ">=3.11"
dependencies = [
    "tzdata>=2025.2; platform_system == 'Windows'",
    "websocket-client>=1.8,<2",
]

[project.optional-dependencies]
model2 = [
    "lightgbm>=4.6,<5",
    "numpy>=1.26,<3",
]
dev = [
    "pytest>=8,<10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
